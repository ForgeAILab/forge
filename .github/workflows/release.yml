name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEB_ARTIFACT: forge-web-${{ github.sha }}

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag, manifests, lockfile, and changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          version = sys.argv[1]
          root = pathlib.Path(".")
          workspace = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_version = workspace["workspace"]["package"]["version"]
          if workspace_version != version:
              raise SystemExit(
                  f"Cargo.toml workspace version {workspace_version!r} does not match tag {version!r}"
              )

          expected_packages = set()
          for member in workspace["workspace"]["members"]:
              manifest = tomllib.loads((root / member / "Cargo.toml").read_text())
              package = manifest["package"]
              if package.get("version") == {"workspace": True}:
                  expected_packages.add(package["name"])

          lock = tomllib.loads((root / "Cargo.lock").read_text())
          lock_versions = {}
          for package in lock["package"]:
              lock_versions.setdefault(package["name"], set()).add(package["version"])
          mismatched = sorted(
              name
              for name in expected_packages
              if version not in lock_versions.get(name, set())
          )
          if mismatched:
              raise SystemExit(
                  "Cargo.lock does not carry the release version for: "
                  + ", ".join(mismatched)
              )

          for manifest_path in [root / "web/package.json", root / "npx-cli/package.json"]:
              manifest_version = json.loads(manifest_path.read_text())["version"]
              if manifest_version != version:
                  raise SystemExit(
                      f"{manifest_path} version {manifest_version!r} does not match tag {version!r}"
                  )

          changelog = (root / "CHANGELOG.md").read_text()
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          PY

  # The tag does not re-run the test suites. This gate requires the CI workflow
  # (Rust, security audit, web, npm) to have passed on this exact commit on the
  # default branch, waiting for it when the tag is pushed right after a merge.
  verify-ci:
    name: Verify CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
    steps:
      - name: Wait for default-branch CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          runs="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=$DEFAULT_BRANCH&per_page=1"
          missing_polls=0
          while true; do
            if ! run=$(gh api "$runs" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "-") \(.html_url)"'); then
              echo "::warning::Could not read CI runs; retrying."
              sleep 60
              continue
            fi
            if [[ -z "$run" ]]; then
              # A run can take a moment to appear after the merge push.
              missing_polls=$((missing_polls + 1))
              if ((missing_polls > 10)); then
                echo "::error::No CI run on $DEFAULT_BRANCH for $SHA. Tag a commit that was pushed to $DEFAULT_BRANCH."
                exit 1
              fi
            else
              read -r status conclusion url <<<"$run"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" == success ]]; then
                  echo "CI passed on $SHA: $url"
                  exit 0
                fi
                echo "::error::CI on $SHA finished with '$conclusion': $url"
                exit 1
              fi
              echo "CI on $SHA is $status: $url"
            fi
            sleep 60
          done

  # Superseded by verify-ci; the same suite already ran on this commit.
  # verify-rust:
  #   name: Verify Rust
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - name: Install Rust
  #       uses: dtolnay/rust-toolchain@stable
  #       with:
  #         components: clippy, rustfmt

  #     - name: Cache Rust dependencies
  #       uses: Swatinem/rust-cache@v2
  #       with:
  #         shared-key: rust
  #         # Restore the CI cache; tag-scoped copies cannot seed later releases.
  #         save-if: false

  #     - name: Run Rust CI
  #       run: ./scripts/ci-rust.sh

  #     - name: Test performance tooling
  #       if: ${{ !cancelled() }}
  #       run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  verify-audit:
    name: Verify security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  verify-web:
    name: Build web
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, types, unit tests and the Playwright smoke run in CI; verify-ci
      # requires them to have passed on this commit.
      # - name: Lint
      #   run: pnpm lint
      #
      # - name: Typecheck
      #   if: ${{ !cancelled() }}
      #   run: pnpm typecheck
      #
      # - name: Unit tests
      #   if: ${{ !cancelled() }}
      #   run: pnpm test

      - name: Build
        run: pnpm build

      # - name: Playwright smoke
      #   if: ${{ !cancelled() }}
      #   run: pnpm run e2e

      - name: Upload verified web assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEB_ARTIFACT }}
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  verify-npm:
    name: Verify npm bootstrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax check
        run: node --check npx-cli/bin/cli.js

      - name: Pack dry run
        working-directory: npx-cli
        run: npm pack --dry-run

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify-version
      - verify-ci
      - verify-audit
      - verify-web
      - verify-npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: forge-x86_64-linux
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: forge-aarch64-linux
            builder: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-x86_64-linux-musl
            builder: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-aarch64-linux-musl
            builder: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: forge-x86_64-macos
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: forge-aarch64-macos
            builder: cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download verified web assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEB_ARTIFACT }}
          path: dist/web/dist

      - name: Build all release binaries
        env:
          FORGE_SKIP_WEB_BUILD: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: >-
          ${{ matrix.builder }} build --locked --release
          --target ${{ matrix.target }}
          -p forge-cli -p forge-client -p forge-solo

      - name: Package and validate archive
        shell: bash
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/forge dist/
          cp target/${{ matrix.target }}/release/forge-ctl dist/
          cp target/${{ matrix.target }}/release/forge-solo dist/
          test -s dist/web/dist/index.html
          archive="${{ matrix.artifact }}.tar.gz"
          tar -czf "$archive" -C dist forge forge-ctl forge-solo web
          tar -tzf "$archive" > "$archive.contents"
          for expected in forge forge-ctl forge-solo web/dist/index.html; do
            grep -Fx "$expected" "$archive.contents" >/dev/null
          done
          rm "$archive.contents"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  # The image builds from the Dockerfile rather than the native archives, so it
  # runs alongside the platform builds instead of after them.
  container:
    name: Publish GHCR image
    needs:
      - verify-version
      - verify-ci
      - verify-audit
      - verify-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` is added automatically for stable semver tags only —
          # pre-releases like v0.1.1-rc.1 correctly skip it.

      - name: Set container cache reference
        shell: bash
        run: |
          cache_image_name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "CONTAINER_CACHE=${REGISTRY}/${cache_image_name}:buildcache" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caches persist across release tags without using Actions quota.
          cache-from: type=registry,ref=${{ env.CONTAINER_CACHE }}
          cache-to: type=registry,ref=${{ env.CONTAINER_CACHE }},mode=max,ignore-error=true
          provenance: true
          sbom: true

  release:
    name: Create GitHub release
    needs:
      - build
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          test "$(find release-files -name '*.tar.gz' -type f | wc -l)" -eq 6
          cd release-files
          sha256sum *.tar.gz > ../SHA256SUMS
          sha256sum -c ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-files/*.tar.gz
            SHA256SUMS

  publish-npm:
    name: Publish npm bootstrapper
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set package version from tag
        working-directory: npx-cli
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish package
        working-directory: npx-cli
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm; skipping publish."
            exit 0
          fi

          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            npm_tag=next
          fi
          npm publish --access public --provenance --tag "$npm_tag"

  update-homebrew-tap:
    name: Request Homebrew tap update
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Dispatch tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          version="${TAG_NAME#v}"
          payload="$(
            jq -nc \
              --arg version "$version" \
              --arg tag "$TAG_NAME" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_run_id "$SOURCE_RUN_ID" \
              '{
                event_type: "forge-release",
                client_payload: {
                  version: $version,
                  tag: $tag,
                  source_repository: $source_repository,
                  source_run_id: $source_run_id
                }
              }'
          )"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ForgeAILab/homebrew-tap/dispatches" \
            -d "$payload"
