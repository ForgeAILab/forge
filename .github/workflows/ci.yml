name: CI

on:
  # Long-lived integration lanes populate branch-scoped caches on pushes.
  # Other branches are covered by their pull_request run.
  push:
    branches:
      - main
      - next/**
  pull_request:

concurrency:
  # Default-branch runs are grouped per commit so none is cancelled: a release
  # tag needs a successful run on its exact commit.
  group: ci-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || github.ref }}
  cancel-in-progress: true

# Same-repository next/** PRs use the push checks on their head commit. Keep
# fork PRs (even heads named next/**) covered by the pull_request checks.
# PR merge-ref caches cannot warm the branch's push runs.
jobs:
  # Runs on every CI run (no job condition) and is required by the Rust gate,
  # including same-repository next/** PRs whose other jobs are skipped.
  file-sizes:
    name: File sizes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check source file sizes
        run: python3 scripts/check-file-sizes.py

  # The Rust gates run as eight parallel jobs: lint, and one test job per shard.
  # Each job has its own dependency cache; a shared key would be saved by
  # whichever job finishes first and miss for the others.
  rust-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'next/') }}
    name: Rust lint
    runs-on: ubuntu-latest
    # Every cargo invocation of the job builds with the same debug-info level,
    # so `make types` reuses the cached dependencies instead of rebuilding them
    # under a second profile. scripts/ci-rust.sh explains the setting.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint
          # Only trusted branch pushes write; PR merge refs remain read-only.
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/next/')) }}
          # Retain dependency artifacts; discard workspace binaries/incremental.
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true

      # A workspace package no test shard covers would stop being tested
      # without any job turning red.
      - name: Check test shard coverage
        run: python3 scripts/ci_rust_shards.py check

      - name: Run fmt and clippy
        if: ${{ !cancelled() }}
        run: ./scripts/ci-rust.sh lint

      - name: Check TypeScript binding drift
        if: ${{ !cancelled() }}
        run: |
          make types
          if ! git diff --exit-code -- web/src/types/generated; then
            echo "::error::TypeScript bindings are out of date. Run 'make types' and commit the generated files."
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- web/src/types/generated)" ]]; then
            echo "::error::Uncommitted TypeScript bindings found. Run 'make types' and commit the generated files."
            exit 1
          fi

      - name: Test performance tooling
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  rust-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'next/') }}
    name: Rust test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others: a run reports every failure.
      fail-fast: false
      matrix:
        # Package/target selections, the test features of the services and db
        # integration targets and the complementary services filters are
        # defined in scripts/ci_rust_shards.py;
        # its `check` (in the lint job) fails if this list differs from it.
        shard: [services-unit-a, services-unit-b, services-integration, api-a, api-b, db, rest]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Keep cold/warm build measurements separate from test execution. The
      # small HTML upload takes <1 second in the measured services unit run.
      CI_RUST_TIMINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test-${{ matrix.shard }}
          # Only trusted branch pushes write; PR merge refs remain read-only.
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/next/')) }}
          # Retain dependency artifacts; discard workspace binaries/incremental.
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true

      - name: Run tests
        run: ./scripts/ci-rust.sh test ${{ matrix.shard }}

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.shard }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

  # One stable check for branch protection and for the workflow conclusion:
  # Normal runs require all Rust jobs. A same-repository next/** PR waits for
  # the whole push workflow on its exact head SHA, so skipped PR jobs cannot
  # report a false green while the canonical push checks are red or pending.
  rust:
    name: Rust
    if: ${{ always() }}
    needs: [file-sizes, rust-lint, rust-test]
    timeout-minutes: 90
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Require file-size guard
        env:
          FILE_SIZES_RESULT: ${{ needs.file-sizes.result }}
        run: |
          echo "File sizes: $FILE_SIZES_RESULT"
          [[ "$FILE_SIZES_RESULT" == success ]]

      - name: Require lint and every test shard
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'next/')) }}
        env:
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TEST_RESULT: ${{ needs.rust-test.result }}
        run: |
          echo "Rust lint: $LINT_RESULT"
          echo "Rust test shards: $TEST_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success ]]

      - name: Wait for integration-lane CI
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'next/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LANE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          missing_polls=0
          while true; do
            if ! run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs" --method GET \
              -f head_sha="$SHA" -f event=push -f branch="$LANE_BRANCH" -f per_page=1 \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "-") \(.html_url)"'); then
              echo "::warning::Could not read integration-lane CI; retrying."
            elif [[ -z "$run" ]]; then
              missing_polls=$((missing_polls + 1))
              if ((missing_polls >= 15)); then
                echo "::error::No push CI run on $LANE_BRANCH for $SHA. Push this commit with CI enabled."
                exit 1
              fi
            else
              read -r status conclusion url <<<"$run"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" == success ]]; then
                  echo "Integration-lane CI passed on $SHA: $url"
                  exit 0
                fi
                echo "::error::Integration-lane CI on $SHA finished with '$conclusion': $url"
                exit 1
              fi
              echo "Integration-lane CI on $SHA is $status: $url"
            fi
            sleep 20
          done

  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'next/') }}
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  web:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'next/') }}
    name: Web
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `if: !cancelled()` on every check below: a failing step no longer skips
      # the rest, so one red web job reports lint, types, unit tests, build and
      # the Playwright smoke together instead of one failure per push.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Playwright smoke
        if: ${{ !cancelled() }}
        run: pnpm run e2e

  npm-bootstrapper:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'next/') }}
    name: npm Bootstrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax check
        run: node --check npx-cli/bin/cli.js

      - name: Pack dry run
        working-directory: npx-cli
        run: npm pack --dry-run
