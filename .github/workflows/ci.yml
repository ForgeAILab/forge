name: CI

on:
  # Other branches are covered by their pull_request run; a push trigger on
  # every branch ran the whole suite twice per PR.
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Default-branch runs are grouped per commit so none is cancelled: a release
  # tag needs a successful run on its exact commit.
  group: ci-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust gates run as seven parallel jobs: lint, and one test job per shard.
  # Each job has its own dependency cache; a shared key would be saved by
  # whichever job finishes first and miss for the others.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    # Every cargo invocation of the job builds with the same debug-info level,
    # so `make types` reuses the cached dependencies instead of rebuilding them
    # under a second profile. scripts/ci-rust.sh explains the setting.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint
          # Branch and PR copies crowd out the default-branch cache.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-on-failure: true

      # A workspace package no test shard covers would stop being tested
      # without any job turning red.
      - name: Check test shard coverage
        run: python3 scripts/ci_rust_shards.py check

      - name: Run fmt and clippy
        if: ${{ !cancelled() }}
        run: ./scripts/ci-rust.sh lint

      - name: Check TypeScript binding drift
        if: ${{ !cancelled() }}
        run: |
          make types
          if ! git diff --exit-code -- web/src/types/generated; then
            echo "::error::TypeScript bindings are out of date. Run 'make types' and commit the generated files."
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- web/src/types/generated)" ]]; then
            echo "::error::Uncommitted TypeScript bindings found. Run 'make types' and commit the generated files."
            exit 1
          fi

      - name: Test performance tooling
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  rust-test:
    name: Rust test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others: a run reports every failure.
      fail-fast: false
      matrix:
        # Package/target selections and the complementary services filters are
        # defined in scripts/ci_rust_shards.py;
        # its `check` (in the lint job) fails if this list differs from it.
        shard: [services-unit-a, services-unit-b, services-integration, api, db, rest]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # One-off: time the test build of each shard. Remove this variable and
      # the upload step once the shard sizes have been read off a few runs.
      CI_RUST_TIMINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test-${{ matrix.shard }}
          # Branch and PR copies crowd out the default-branch cache.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-on-failure: true

      - name: Run tests
        run: ./scripts/ci-rust.sh test ${{ matrix.shard }}

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.shard }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

  # One stable check for branch protection and for the workflow conclusion:
  # green only when lint and every test shard are green. `always()` makes it
  # run, and fail, when a job it needs failed, was cancelled or was skipped.
  rust:
    name: Rust
    if: ${{ always() }}
    needs: [rust-lint, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and every test shard
        env:
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TEST_RESULT: ${{ needs.rust-test.result }}
        run: |
          echo "Rust lint: $LINT_RESULT"
          echo "Rust test shards: $TEST_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success ]]

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  web:
    name: Web
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `if: !cancelled()` on every check below: a failing step no longer skips
      # the rest, so one red web job reports lint, types, unit tests, build and
      # the Playwright smoke together instead of one failure per push.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Playwright smoke
        if: ${{ !cancelled() }}
        run: pnpm run e2e

  npm-bootstrapper:
    name: npm Bootstrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax check
        run: node --check npx-cli/bin/cli.js

      - name: Pack dry run
        working-directory: npx-cli
        run: npm pack --dry-run
