name: Bootstrap runtime performance patch

on:
  push:
    branches:
      - perf/runtime-hotspots

permissions:
  contents: write

concurrency:
  group: perf-runtime-hotspots-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: perf/runtime-hotspots

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          cat tools/perf_patch.b64.* | base64 --decode | gzip --decompress > /tmp/apply_perf_patch.py
          python /tmp/apply_perf_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/agent-host/src/typed_tools.rs')
          text = path.read_text()

          derive_target = '\nstruct ExecutedCommand {\n'
          if text.count(derive_target) != 1:
              raise SystemExit('ExecutedCommand derive insertion target drifted')
          text = text.replace(
              derive_target,
              '\n#[derive(Debug)]\nstruct ExecutedCommand {\n',
              1,
          )

          temporary_args = '\n'.join([
              '        let command = execute_workspace_command(',
              '            "python3",',
              '            &[',
              '                "-c".to_owned(),',
              '                "import time; time.sleep(30)".to_owned(),',
              '            ],',
              '            None,',
              '            &ctx,',
              '        );',
          ]) + '\n'
          bound_args = '\n'.join([
              '        let args = [',
              '            "-c".to_owned(),',
              '            "import time; time.sleep(30)".to_owned(),',
              '        ];',
              '        let command = execute_workspace_command("python3", &args, None, &ctx);',
          ]) + '\n'
          if text.count(temporary_args) != 1:
              raise SystemExit('command cancellation test target drifted')
          text = text.replace(temporary_args, bound_args, 1)

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Agent-host regression tests
        run: cargo test -p forge-agent-host --lib

      - name: Authentication regression tests
        run: cargo test -p services auth_service

      - name: MCP regression tests
        run: cargo test -p mcp-server --lib

      - name: API regression tests
        run: cargo test -p api --lib

      - name: Workspace compile check
        run: cargo check --workspace --all-targets

      - name: Commit verified source changes
        shell: bash
        run: |
          rm -f tools/perf_patch.b64.* .github/workflows/perf-runtime-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: harden API and agent runtime hot paths'
          git push origin HEAD:perf/runtime-hotspots
