name: Apply Memory Context Patch

on:
  push:
    branches:
      - feat/lightweight-memory-recall
    paths:
      - scripts/apply_memory_context_patch.py
      - scripts/apply_memory_context_patch_v2.py
      - .github/workflows/apply-memory-context.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/lightweight-memory-recall
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply validated patch
        run: python3 scripts/apply_memory_context_patch_v2.py

      - name: Format
        run: cargo fmt --all

      - name: Commit validated code
        run: |
          # GITHUB_TOKEN may not create or update workflow files. The fast
          # workflow is updated separately through the authorized connector.
          git checkout -- .github/workflows/memory-recall-fast.yml
          rm scripts/apply_memory_context_patch.py
          rm scripts/apply_memory_context_patch_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(memory): inject bounded recall into agent chat context"
          git push origin HEAD:feat/lightweight-memory-recall
