name: Apply bounded memory recall

on:
  push:
    branches:
      - feat/memory-recall-lite

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct implementation payload
        run: |
          cat tools/memory-recall-payload/apply.gz.b64 | base64 --decode | gzip --decompress > tools/apply_memory_recall.py
          cat tools/memory-recall-payload/service.gz.b64 | base64 --decode | gzip --decompress > crates/services/src/memory_recall.rs
          cat tools/memory-recall-payload/test.gz.b64 | base64 --decode | gzip --decompress > crates/services/tests/memory_recall.rs
          cat tools/memory-recall-payload/doc.gz.b64 | base64 --decode | gzip --decompress > docs/memory-recall.md

      - name: Apply implementation
        run: python tools/apply_memory_recall.py

      - name: Verify and publish result
        shell: bash
        run: |
          set -uo pipefail
          LOG=tools/memory-recall-check.log
          : > "$LOG"

          run_check() {
            local label="$1"
            shift
            echo "===== ${label} =====" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            local status=${PIPESTATUS[0]}
            echo | tee -a "$LOG"
            return "$status"
          }

          phase=""
          run_check "cargo fmt --all" cargo fmt --all || phase="format"
          if [[ -z "$phase" ]]; then
            run_check "cargo check -p services --tests --locked" cargo check -p services --tests --locked || phase="check"
          fi
          if [[ -z "$phase" ]]; then
            run_check "cargo test -p services --test memory_recall --locked" cargo test -p services --test memory_recall --locked || phase="integration-test"
          fi
          if [[ -z "$phase" ]]; then
            run_check "cargo test -p services memory_recall --lib --locked" cargo test -p services memory_recall --lib --locked || phase="unit-test"
          fi
          if [[ -z "$phase" ]]; then
            run_check "cargo test -p services effective_prompt_appends_bounded_memory --lib --locked" cargo test -p services effective_prompt_appends_bounded_memory --lib --locked || phase="prompt-test"
          fi
          if [[ -z "$phase" ]]; then
            run_check "cargo clippy -p services --tests --locked -- -D warnings" cargo clippy -p services --tests --locked -- -D warnings || phase="clippy"
          fi

          rm -rf tools/memory-recall-payload
          rm tools/apply_memory_recall.py .github/workflows/apply-memory-recall.yml
          git config user.name "forge-memory-bot"
          git config user.email "forge-memory-bot@users.noreply.github.com"

          if [[ -n "$phase" ]]; then
            git add -A
            git commit -m "wip(memory): capture ${phase} diagnostics"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit 1
          fi

          rm "$LOG"
          git add -A
          git diff --cached --check
          git commit -m "feat(memory): add bounded task recall"
          git push origin HEAD:${GITHUB_REF_NAME}
