name: Memory Recall Fast Check

on:
  push:
    branches:
      - feat/lightweight-memory-recall
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall:
    name: Focused Rust recall
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p services --lib --test memory_recall -- -D warnings

      - name: Recall unit tests
        run: cargo test -p services --lib memory_source::relevance::tests -- --nocapture

      - name: Recall integration tests
        run: cargo test -p services --test memory_recall -- --nocapture
