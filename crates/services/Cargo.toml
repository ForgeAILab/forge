[package]
name = "services"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
api-types = { path = "../api-types" }
cli-adapters = { path = "../cli-adapters" }
db = { path = "../db" }
events = { path = "../events" }
executors = { path = "../executors" }
forge-agent-host = { path = "../agent-host" }
git = { path = "../git" }
review = { path = "../review" }
workspace = { path = "../workspace" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bcrypt = "0.19"
config = { path = "../config" }
hex = "0.4"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "signal", "sync", "time", "process", "net", "fs", "io-util"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tracing = { workspace = true }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
which = "*"

[dev-dependencies]
agent-runtime.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
