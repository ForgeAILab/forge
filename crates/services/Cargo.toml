[package]
name = "services"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = ["cli-adapters/test-support"]

# The integration targets use the `test-support` fixtures. They name the
# feature here instead of through a `services = { path = "." }` self
# dev-dependency: that made every `cargo test -p services --lib` build compile
# the plain lib and then the test lib, in series. Build them with
# `--features test-support`; see docs/ci.md.
[[test]]
name = "main"
required-features = ["test-support"]

[[test]]
name = "main_project_create_command"
required-features = ["test-support"]

[[test]]
name = "project_provisioning_characterization"
required-features = ["test-support"]

[dependencies]
check-executor = { path = "../check-executor" }
operation-registry = { path = "../operation-registry" }
pricing = { path = "../pricing" }
api-types = { path = "../api-types" }
cli-adapters = { path = "../cli-adapters" }
db = { path = "../db" }
events = { path = "../events" }
executors = { path = "../executors" }
forge-agent-host = { path = "../agent-host" }
git = { path = "../git" }
review = { path = "../review" }
workspace = { path = "../workspace" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bcrypt = "0.17"
config = { path = "../config" }
hex = "0.4"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "signal", "sync", "time", "process", "net", "fs", "io-util"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tracing = { workspace = true }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
which = "*"

[dev-dependencies]
process-supervisor = { path = "../process-supervisor" }
tracing-subscriber.workspace = true
cli-adapters = { path = "../cli-adapters", features = ["test-support"] }
db = { path = "../db", features = ["test-template"] }
pricing = { path = "../pricing", features = ["test-support"] }
agent-runtime.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
