[package]
name = "executors"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
process-supervisor = { path = "../process-supervisor" }
config = { path = "../config" }
tracing.workspace = true
api-types = { path = "../api-types" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only audited OS syscalls permit unsafe: run_process's pre_exec callback, the
# statvfs reading in gc and the descriptor-relative walk in fd_tree.
# The workspace lint table forbids unsafe code, which cannot be overridden
# locally, so this crate does not inherit it: copy any new workspace lint here.
[lints.rust]
unsafe_code = "deny"
