[package]
name = "services-agents"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Forge's agents, chat services, and shared runtime composition"

[lib]
path = "src/lib.rs"

[features]
test-support = ["services/test-support"]

[dependencies]
services = { path = "../services" }
git = { path = "../git" }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
api-types = { path = "../api-types" }
config = { path = "../config" }
db = { path = "../db" }
events = { path = "../events" }
executors = { path = "../executors" }
forge-agent-host = { path = "../agent-host" }
pricing = { path = "../pricing" }
review = { path = "../review" }
workspace = { path = "../workspace" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "net", "io-util"] }
tracing.workspace = true

[dev-dependencies]
agent-runtime.workspace = true
services = { path = "../services", features = ["test-support"] }
db = { path = "../db", features = ["test-template"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
