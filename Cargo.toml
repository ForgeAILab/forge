[workspace]
members = [
    "crates/forge-solo",
    "crates/forge-cli",
    "crates/forge-client",
    "crates/forge-daemon",
    "crates/api",
    "crates/api-types",
    "crates/db",
    "crates/services",
    "crates/services-agents",
    "crates/pricing",
    "crates/executors",
    "crates/cli-adapters",
    "crates/workspace",
    "crates/git",
    "crates/process-supervisor",
    "crates/check-executor",
    "crates/review",
    "crates/events",
    "crates/mcp-server",
    "crates/config",
    "crates/agent-host",
    "crates/operation-registry",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.14.0"
license = "MIT"
description = "AI coding agent workflow engine — orchestrate agents through structured task lifecycles"
homepage = "https://github.com/ForgeAILab/forge"
repository = "https://github.com/ForgeAILab/forge"

[workspace.dependencies]
# agent-runtime v0.8.0 (all runtime packages and testkit share this immutable release pin).
agent-runtime = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "fd5b14ca12f4a8dbc4d52030f3c095292f4eb4a7", features = ["provider-summary"], version = "0.8.0" }
agent-runtime-testkit = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "fd5b14ca12f4a8dbc4d52030f3c095292f4eb4a7", version = "0.8.0" }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Migration replay and DB-backed tests spend most of their time in these crates.
# The test profile inherits dev package overrides; workspace code stays in debug.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.sqlx-sqlite]
opt-level = 3

[profile.dev.package.sqlx-core]
opt-level = 3
